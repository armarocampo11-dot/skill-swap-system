<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stats - STI Skill Swap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div class="app-header-top">
        <div class="app-title">
          <h1>Stats</h1>
          <p>Performance center</p>
        </div>
        <div class="app-header-actions"><button class="app-round-btn" title="Requests" onclick="goToRequests()">🔔<span id="requestBadge" class="notification-badge" style="display:none;">0</span></button><button class="app-round-btn app-avatar-btn" title="Profile" onclick="goToProfile()">👤</button><button class="app-round-btn logout-round-btn" title="Logout" onclick="logout()">⏻</button></div>
      </div>
      <div class="app-tabs"><button data-route="home" onclick="goToDashboard()">🏠 Dashboard</button><button data-route="requests" onclick="goToRequests()">💬 Requests</button><button data-route="connections" onclick="goToConnections()">🤝 Connections</button></div>
    </header>
    <section class="app-content">
      <section class="app-hero">
        <div class="app-hero-icon">📊</div>
        <div>
          <span class="app-kicker">STI Skill Swap</span>
          <h2>Swap <span>Stats</span></h2>
          <p>Track requests, success rate, and activity history.</p>
        </div>
      </section>
      <div id="statsWelcome" class="app-note">Loading stats...</div><section class="stats-grid-2"><div class="stats-box"><h3 id="totalRequests">0</h3><p>Total Requests</p></div><div class="stats-box"><h3 id="completedSwaps">0</h3><p>Completed</p></div><div class="stats-box"><h3 id="acceptedRequests">0</h3><p>Active</p></div><div class="stats-box"><h3 id="rejectedFailed">0</h3><p>Failed</p></div><div class="stats-box"><h3 id="successRate">0%</h3><p>Success Rate</p></div><div class="stats-box"><h3 id="ratingAverage">0.0★</h3><p>Rating</p></div></section><section class="app-section-head"><h3>History</h3><span id="historyCount" class="reputation-tier-pill">0</span></section><section id="historyList" class="requests-modern-list"></section>
    </section>
  </main>
  
  <nav class="app-bottom-nav">
    <button  onclick="goToDashboard()">🏠<span>Home</span></button>
    <button  onclick="goToBrowse()">🔎<span>Discover</span></button>
    <button  onclick="goToRequests()">💬<span>Requests</span></button>
    <button class="active" onclick="goToProfile()">👤<span>Profile</span></button>
  </nav>
  <script type="module" src="common-nav.js"></script>
  <script type="module" src="stats.js"></script>
</body>
</html>
