<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stats - STI Skill Swap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="navbar">
    <h2>Stats</h2>
    <div class="nav-links">
      <button onclick="goToDashboard()">Dashboard</button>
      <button onclick="goToProfile()">Profile</button>
      <button onclick="goToRatings()">Ratings</button>
    </div>
  </div>

  <div class="page">
    <div class="container dashboard-shell">

      <section class="dashboard-hero card">
        <p class="dashboard-kicker">Performance center</p>
        <h1 class="hero-title">Swap <span class="glow-text">Stats</span></h1>
        <p id="statsWelcome" class="dashboard-welcome">Loading stats.</p>
      </section>

      <section class="stats-grid-2">
        <div class="stats-box">
          <h3 id="totalRequests">0</h3>
          <p>Total Requests</p>
        </div>

        <div class="stats-box">
          <h3 id="completedSwaps">0</h3>
          <p>Completed</p>
        </div>

        <div class="stats-box">
          <h3 id="acceptedRequests">0</h3>
          <p>Active</p>
        </div>

        <div class="stats-box">
          <h3 id="rejectedFailed">0</h3>
          <p>Failed</p>
        </div>
      </section>

      <section class="stats-grid-2">
        <div class="stats-box">
          <h3 id="successRate">0%</h3>
          <p>Success Rate</p>
        </div>

        <div class="stats-box">
          <h3 id="ratingAverage">0.0★</h3>
          <p>Rating</p>
        </div>
      </section>

      <section class="card">
        <div class="dashboard-section-head">
          <div>
            <h2>Recent Activity</h2>
            <p class="small-text">Your latest swap history.</p>
          </div>
        </div>

        <div id="activityHistory" class="requests-modern-list"></div>
      </section>

    </div>
  </div>

  <nav class="bottom-nav">
    <button onclick="goToDashboard()">🏠<span>Home</span></button>
    <button onclick="goToBrowse()">🔎<span>Discover</span></button>
    <button onclick="goToRequests()">💬<span>Requests</span></button>
    <button onclick="goToProfile()">👤<span>Profile</span></button>
  </nav>

  <script type="module" src="stats.js"></script>
</body>
</html>
