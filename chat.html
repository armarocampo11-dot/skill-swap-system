<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat - STI Skill Swap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="navbar">
    <h2>Chat</h2>
    <div class="nav-links">
      <button onclick="goBack()">Connections</button>
    </div>
  </div>

  <div class="page">
    <div class="container">

      <section class="card">
        <h1 class="hero-title">
          <span id="chatPartner">Loading.</span>
        </h1>
        <p id="chatMeta" class="subtitle">Loading chat info.</p>
        <div id="chatStatus"></div>
      </section>

      <section id="messagesBox" class="chat-message-area"></section>

      <section class="chat-composer-bar">
        <input type="text" id="messageInput" placeholder="Type your message..." />
        <button onclick="sendMessage()">Send</button>
      </section>

    </div>
  </div>

  <script type="module" src="chat.js"></script>
</body>
</html>
