<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Rate Partner - Skill Swap</title><link rel="stylesheet" href="style.css"></head><body><main class="app-shell"><header class="app-header"><div class="app-header-top"><div class="app-title"><h1>Rate</h1><p>Review completed transaction</p></div><div class="app-header-actions"><button class="app-round-btn" title="Back" onclick="goBack()">↩</button><button class="app-round-btn logout-round-btn" title="Logout" onclick="logout()">⏻</button></div></div></header><section class="app-content"><section class="card"><span class="app-kicker">Completed transaction</span><h1 class="hero-title">Rate Your <span class="glow-text">Partner</span></h1><p class="subtitle">Leave short feedback after your completed swap.</p></section><section class="card"><p><strong>Partner:</strong> <span id="partnerName">Loading...</span></p><p><strong>Status:</strong> <span id="requestStatus">Loading...</span></p><label for="stars">Star Rating</label><select id="stars"><option value="5">5 - Excellent</option><option value="4">4 - Very Good</option><option value="3">3 - Good</option><option value="2">2 - Fair</option><option value="1">1 - Poor</option></select><label for="feedback">Feedback</label><textarea id="feedback" rows="4" placeholder="Write a short review."></textarea><button id="submitRatingBtn" class="success-btn" onclick="submitRating()">Submit Rating</button><p id="ratingStatus" class="small-text"></p></section></section></main><script type="module" src="common-nav.js"></script>
  <script type="module" src="rating.js"></script></body></html>
