<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swipe - STI Skill Swap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="navbar">
    <h2>Swipe</h2>
    <div class="nav-links">
      <button onclick="goToDashboard()">Dashboard</button>
      <button onclick="goToBrowse()">Browse</button>
      <button onclick="goToProfile()">Profile</button>
    </div>
  </div>

  <div class="page">
    <div class="container">

      <section class="dashboard-hero swipe-page-hero">
        <p class="dashboard-kicker">Quick matching</p>
        <h1 class="hero-title">Swipe <span class="glow-text">Students</span></h1>
        <p class="subtitle">Swipe left to skip, right to view and connect.</p>
      </section>

      <section class="swipe-stage">
        <div id="swipeStack" class="swipe-stack"></div>

        <div id="swipeEmpty" class="swipe-empty hidden">
          <div class="reviews-empty-icon">🎉</div>
          <h3>No more students</h3>
          <p>You've reached the end of the current list.</p>

          <div class="swipe-empty-actions">
            <button onclick="reloadSwipeCards()">Reload</button>
            <button class="secondary-btn" onclick="goToBrowse()">Browse</button>
          </div>
        </div>
      </section>

      <div class="swipe-actions">
        <button class="danger-btn" onclick="skipCurrentCard()">Skip</button>
        <button onclick="interestedCurrentCard()">Interested</button>
      </div>

    </div>
  </div>

  <nav class="bottom-nav">
    <button onclick="goToDashboard()">🏠<span>Home</span></button>
    <button class="active" onclick="goToBrowse()">🔎<span>Discover</span></button>
    <button onclick="goToRequests()">💬<span>Requests</span></button>
    <button onclick="goToProfile()">👤<span>Profile</span></button>
  </nav>

  <script type="module" src="swipe.js"></script>
</body>
</html>
