<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Progress - STI Skill Swap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="navbar">
    <h2>Progress</h2>
    <div class="nav-links">
      <button onclick="goToDashboard()">Dashboard</button>
      <button onclick="goToMissions()">Missions</button>
      <button onclick="goToProfile()">Profile</button>
    </div>
  </div>

  <div class="page">
    <div class="container dashboard-shell">

      <section class="progress-hero-card">
        <div class="progress-hero-top">
          <div>
            <p class="progress-kicker">Progress center</p>
            <h1>Your <span class="glow-text">Growth</span></h1>
            <p id="progressWelcome">Loading progress...</p>
          </div>

          <div class="progress-hero-actions">
            <button onclick="goToMissions()">Missions</button>
          </div>
        </div>
      </section>

      <section class="progress-level-card">
        <div class="progress-level-head">
          <div>
            <p class="progress-section-kicker">Level overview</p>
            <h2>Level <span id="levelNumber">1</span></h2>
            <p class="progress-soft-text">Earn XP through swaps, missions, ratings, and profile completion.</p>
          </div>

          <div class="progress-level-chip">
            <span>XP</span>
            <strong id="xpPointsMain">0</strong>
          </div>
        </div>

        <div class="progress-wrap">
          <div class="progress-bar-container">
            <div class="progress-bar" id="xpBar"></div>
          </div>
        </div>

        <div class="progress-meter-labels">
          <span id="xpRemaining">0 XP until next level</span>
          <span id="profileCompletionText">Profile completion: 0%</span>
        </div>
      </section>

      <section class="progress-focus-single">
        <div class="progress-mini-box">
          <span class="progress-focus-label">Next Goal</span>
          <strong id="nextGoalText">Loading...</strong>
        </div>

        <div class="progress-mini-box">
          <span class="progress-focus-label">Rank</span>
          <strong id="rankTitle">Beginner</strong>
        </div>
      </section>

      <section class="progress-panel-card">
        <div class="progress-panel-head">
          <div>
            <h3>XP Breakdown</h3>
            <p>This is where your XP comes from.</p>
          </div>
        </div>

        <div id="xpBreakdownList" class="xp-breakdown-list"></div>
      </section>

    </div>
  </div>

  <nav class="bottom-nav">
    <button onclick="goToDashboard()">🏠<span>Home</span></button>
    <button onclick="goToBrowse()">🔎<span>Discover</span></button>
    <button onclick="goToRequests()">💬<span>Requests</span></button>
    <button class="active" onclick="goToProfile()">👤<span>Profile</span></button>
  </nav>

  <script type="module" src="progress.js"></script>
</body>
</html>
