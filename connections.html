<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connections - STI Skill Swap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div class="app-header-top">
        <div class="app-title">
          <h1>Connections</h1>
          <p>Your active chats and accepted swaps</p>
        </div>
        <div class="app-header-actions"><button class="app-round-btn" title="Requests" onclick="goToRequests()">🔔<span id="requestBadge" class="notification-badge" style="display:none;">0</span></button><button class="app-round-btn app-avatar-btn" title="Profile" onclick="goToProfile()">👤</button><button class="app-round-btn logout-round-btn" title="Logout" onclick="logout()">⏻</button></div>
      </div>
      <div class="app-tabs"><button data-route="home" onclick="goToDashboard()">🏠 Dashboard</button><button data-route="requests" onclick="goToRequests()">💬 Requests</button><button data-route="connections" onclick="goToConnections()">🤝 Connections</button></div>
    </header>
    <section class="app-content">
      <section class="app-hero">
        <div class="app-hero-icon">🤝</div>
        <div>
          <span class="app-kicker">STI Skill Swap</span>
          <h2>Active <span>Chats</span></h2>
          <p>Continue conversations with your accepted skill partners.</p>
        </div>
      </section>
      <div id="connectionsWelcome" class="app-note">Loading conversations...</div>
      <section class="app-section-head"><h3>Messages</h3><button onclick="goToBrowse()">Find Students</button></section>
      <section id="conversationList" class="chat-conversation-list"></section>
      <section class="chat-main-panel"><div id="threadHeader" class="chat-main-header"><div class="chat-main-header-left"><img id="threadAvatar" class="chat-main-avatar" src="avatars/avatar1.png" alt="Avatar"><div><h3 id="threadName">Select a conversation</h3><p id="threadSubtext" class="small-text">Your messages will appear here.</p></div></div></div><div id="threadMessages" class="chat-message-area"><div class="chat-empty-state"><div class="chat-empty-icon">💬</div><h4>No conversation selected</h4><p>Choose a chat to start messaging.</p></div></div><div class="chat-status-row"><span id="typingStatus" class="small-text"></span></div><div class="chat-composer-bar"><textarea id="threadInput" rows="1" placeholder="Type a message..."></textarea><button id="sendThreadBtn">Send</button></div></section>
    </section>
  </main>
  
  <nav class="app-bottom-nav">
    <button  onclick="goToDashboard()">🏠<span>Home</span></button>
    <button  onclick="goToBrowse()">🔎<span>Discover</span></button>
    <button  onclick="goToRequests()">💬<span>Requests</span></button>
    <button class="active" onclick="goToProfile()">👤<span>Profile</span></button>
  </nav>
  <script type="module" src="common-nav.js"></script>
  <script type="module" src="connections.js"></script>
</body>
</html>
