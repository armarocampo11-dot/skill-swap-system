<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Missions - STI Skill Swap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="mobile-app-page missions-page">

  <main class="app-screen mission-app-screen">
    <section class="app-header">
      <div>
        <h1>Mission Center</h1>
        <p id="missionsWelcome">Loading missions...</p>
      </div>

      <div class="app-header-actions">
        <button class="app-icon-btn" onclick="goToDashboard()">🏠</button>
      </div>
    </section>

    <section class="app-stats-strip">
      <div>
        <span>🏆</span>
        <strong id="totalXp">0 XP</strong>
        <p id="missionRank">Starter</p>
      </div>
      <div>
        <span>✅</span>
        <strong id="completedMissions">0</strong>
        <p>Done</p>
      </div>
      <div>
        <span>🔥</span>
        <strong id="activeMissions">0</strong>
        <p>Active</p>
      </div>
      <div>
        <span>👤</span>
        <strong id="profilePercent">0%</strong>
        <p>Profile</p>
      </div>
    </section>

    <section class="mission-simple-section">
      <h2>Daily Missions</h2>
      <div id="dailyMissionsList" class="mission-grid"></div>
    </section>

    <section class="mission-simple-section">
      <h2>Milestone Missions</h2>
      <div id="milestoneMissionsList" class="mission-grid"></div>
    </section>

    <section class="mission-simple-section">
      <h2>Reputation Missions</h2>
      <div id="reputationMissionsList" class="mission-grid"></div>
    </section>
  </main>

  <nav class="app-bottom-nav">
    <button onclick="goToDashboard()">🏠<span>Home</span></button>
    <button onclick="goToBrowse()">🔎<span>Discover</span></button>
    <button onclick="goToRequests()">💬<span>Requests</span></button>
    <button onclick="goToProfile()">👤<span>Profile</span></button>
  </nav>

  <script type="module" src="missions.js"></script>
</body>
</html>
