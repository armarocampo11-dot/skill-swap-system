<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Missions - STI Skill Swap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="missions-page">

  <div class="navbar">
    <h2>Missions</h2>
    <div class="nav-links">
      <button onclick="goToDashboard()">Dashboard</button>
      <button onclick="goToSwipe()">Swipe</button>
      <button onclick="goToProfile()">Profile</button>
    </div>
  </div>

  <div class="page">
    <div class="container">

      <section class="dashboard-hero card">
        <p class="dashboard-kicker">Mission center</p>
        <h1 class="hero-title">Growth <span class="glow-text">Missions</span></h1>
        <p id="missionsWelcome" class="dashboard-welcome">Loading missions...</p>
      </section>

      <section class="mission-stats">
        <div class="mission-stat-card">
          <p>Total XP</p>
          <h2 id="totalXp">0 XP</h2>
          <span id="missionRank" class="mission-badge">Starter</span>
        </div>

        <div class="mission-stat-card">
          <p>Completed</p>
          <h2 id="completedMissions">0</h2>
        </div>

        <div class="mission-stat-card">
          <p>Active</p>
          <h2 id="activeMissions">0</h2>
        </div>

        <div class="mission-stat-card">
          <p>Profile</p>
          <h2 id="profilePercent">0%</h2>
        </div>
      </section>

      <section class="card">
        <div class="dashboard-section-head">
          <div>
            <h2>Daily Missions</h2>
            <p class="small-text">Small tasks to stay active.</p>
          </div>
        </div>
        <div id="dailyMissionsList" class="mission-grid"></div>
      </section>

      <section class="card">
        <div class="dashboard-section-head">
          <div>
            <h2>Milestone Missions</h2>
            <p class="small-text">Long-term growth goals.</p>
          </div>
        </div>
        <div id="milestoneMissionsList" class="mission-grid"></div>
      </section>

      <section class="card">
        <div class="dashboard-section-head">
          <div>
            <h2>Reputation Missions</h2>
            <p class="small-text">Build trust through swaps.</p>
          </div>
        </div>
        <div id="reputationMissionsList" class="mission-grid"></div>
      </section>

    </div>
  </div>

  <nav class="bottom-nav">
    <button onclick="goToDashboard()">🏠<span>Home</span></button>
    <button onclick="goToBrowse()">🔎<span>Discover</span></button>
    <button onclick="goToRequests()">💬<span>Requests</span></button>
    <button onclick="goToProfile()">👤<span>Profile</span></button>
  </nav>

  <script type="module" src="missions.js"></script>
</body>
</html>
